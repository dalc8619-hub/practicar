<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarWash Pro · Panel de empleado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="panel">
  <header class="panel-header">
    <div class="logo">CarWash <span>Pro</span></div>
    <div class="session">
      <strong id="nombreEmpleado">—</strong>
      <span id="cargoEmpleado">—</span>
      <span id="usuarioEmpleado" class="muted">—</span>
    </div>
    <button id="cerrarSesion" class="btn ghost">Cerrar sesión</button>
  </header>

  <main class="panel-body">
    <section class="panel-block">
      <h1>Servicios registrados</h1>
      <p>Consulta tus servicios recientes y agrega nuevos lavados realizados.</p>
      <div id="msg" class="msg" role="status"></div>
    </section>

    <section class="panel-block">
      <form id="form-servicio" class="grid form-grid">
        <label>
          Nombre del cliente
          <input type="text" id="nombreCliente" placeholder="Ej. Laura Pérez" />
        </label>
        <label>
          Placa del vehículo
          <input type="text" id="placaVehiculo" placeholder="ABC123" maxlength="7" />
        </label>
        <label>
          Tipo de servicio
          <select id="tipoServicio">
            <option value="">Selecciona uno</option>
            <option value="Lavado express">Lavado express</option>
            <option value="Detailing premium">Detailing premium</option>
            <option value="Desinfección interior">Desinfección interior</option>
            <option value="Protección cerámica">Protección cerámica</option>
          </select>
        </label>
        <label>
          Fecha del servicio
          <input type="date" id="fechaServicio" />
        </label>
        <button type="submit" class="btn">Registrar servicio</button>
      </form>
    </section>

    <section class="panel-block">
      <div id="listaServicios" class="servicios-lista">
        <p>No hay servicios registrados aún.</p>
      </div>
    </section>
  </main>

  <script src="assets/js/empleado.js" defer></script>
</body>
</html>
